<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренажёр чанков</title>
<style>
:root{
  --bg:#f5f2ea; --surface:#fffdf8; --ink:#1d2321; --muted:#68706b; --line:#ddd8cb;
  --accent:#0e6656; --accent-ink:#ffffff; --accent-soft:#dbeae5;
  --again:#a8392f; --hard:#9a6a12; --good:#0e6656; --easy:#2c5a9e;
  --bad-soft:#f4dfdb; --mark:#fbe9a8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131715; --surface:#1b201e; --ink:#e7eae5; --muted:#98a19b; --line:#2e3532;
    --accent:#5cc0aa; --accent-ink:#0d1513; --accent-soft:#1f3a34;
    --again:#e2786d; --hard:#d9a646; --good:#5cc0aa; --easy:#7fa8e6;
    --bad-soft:#3a2522; --mark:#4d4420;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 20px}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:.01em}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:14px}
nav button[aria-current=page]{color:var(--ink);background:var(--accent-soft)}
h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;margin:0 0 8px;text-wrap:balance}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 18px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:500;min-height:40px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stage{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.task{font-size:15px;color:var(--muted);margin-bottom:14px}
.chunk{font-family:var(--serif);font-size:32px;line-height:1.15;margin:4px 0 6px;overflow-wrap:anywhere}
.ru{font-size:18px;margin-bottom:14px}
.en{font-family:var(--serif);font-size:20px;line-height:1.45}
ul.examples{list-style:none;margin:0 0 6px;padding:0}
ul.examples li{font-family:var(--serif);font-size:18px;padding:8px 0;border-top:1px solid var(--line)}
.note{font-size:14px;border-left:3px solid var(--hard);padding:4px 0 4px 12px;margin:14px 0 0;color:var(--muted)}
.note b{color:var(--ink);font-weight:600}
.tokens{font-family:var(--serif);font-size:22px;line-height:2;margin-bottom:16px}
.tok{display:inline-block;padding:0 3px;margin:0;border-radius:6px;border:1px solid transparent;background:none;font:inherit;color:inherit}
.tok.word{border-bottom:1px dashed var(--line)}
.tok.sel{background:var(--mark)}
.tok.right{background:var(--accent-soft);border-color:var(--accent)}
.tok.wrong{background:var(--bad-soft)}
.opts{display:grid;gap:10px;margin:14px 0 8px}
.opt{text-align:left;min-height:52px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:17px}
.opt.right{border-color:var(--good);background:var(--accent-soft)}
.opt.wrong{border-color:var(--again);background:var(--bad-soft)}
input[type=text],textarea,input[type=number],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:92px;resize:vertical;font-family:var(--serif);font-size:18px}
input[type=text]{font-family:var(--serif);font-size:20px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.verdict{font-weight:600;margin:14px 0 6px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--again)}
.model{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:8px 0 4px}
.model .lbl,.yours .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.yours{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin:12px 0 4px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;min-height:60px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rate button b{font-size:15px}
.rate button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rate .g1 b{color:var(--again)} .rate .g2 b{color:var(--hard)} .rate .g3 b{color:var(--good)} .rate .g4 b{color:var(--easy)}
.rate button.suggest{border-width:2px;border-color:currentColor}
.rate .g1.suggest{color:var(--again)} .rate .g2.suggest{color:var(--hard)} .rate .g3.suggest{color:var(--good)} .rate .g4.suggest{color:var(--easy)}
.legend{font-size:13px;color:var(--muted);margin-top:10px}
.actions{margin-top:18px;display:grid;gap:8px}
.topic{margin-top:22px}
details.item{border-top:1px solid var(--line);padding:10px 0}
details.item summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
details.item summary::-webkit-details-marker{display:none}
details.item .e{font-family:var(--serif);font-size:19px;overflow-wrap:anywhere}
details.item .r{font-size:14px;color:var(--muted)}
.chip{flex:none;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.due{border-color:var(--accent);color:var(--accent)}
.chip.leech{border-color:var(--again);color:var(--again)}
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;margin-bottom:4px}
.field .hint{font-size:13px;color:var(--muted);margin-top:4px}
.banner{background:var(--bad-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:380px){.chunk{font-size:27px}.rate button b{font-size:14px}}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>

// FSRS-6 с параметрами по умолчанию (те же, что в ts-fsrs 5.x / современном Anki).
const FSRS = (() => {
  const W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796,
    1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
  const DECAY = -W[20];
  const FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
  const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
  const S_MIN = 0.001;

  // Вероятность вспомнить через t дней при стабильности s.
  const retrievability = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);
  // Интервал в днях, при котором вероятность вспомнить упадёт до retention.
  const interval = (s, retention) =>
    clamp(Math.round(s / FACTOR * (Math.pow(retention, 1 / DECAY) - 1)), 1, 36500);
  const initDifficulty = g => W[4] - Math.exp((g - 1) * W[5]) + 1;

  // mem: {s, d} или null для новой карточки; g: 1 Again, 2 Hard, 3 Good, 4 Easy; t: прошло дней.
  function next(mem, g, t) {
    if (!mem || !mem.s) {
      return { s: Math.max(W[g - 1], 0.1), d: clamp(initDifficulty(g), 1, 10) };
    }
    const { s, d } = mem;
    const r = retrievability(t, s);
    const damped = d + (-W[6] * (g - 3)) * (10 - d) / 9;
    const nd = clamp(W[7] * initDifficulty(4) + (1 - W[7]) * damped, 1, 10);
    let ns;
    if (t < 1) {
      const sinc = Math.pow(s, -W[19]) * Math.exp(W[17] * (g - 3 + W[18]));
      ns = s * (g >= 2 ? Math.max(sinc, 1) : sinc);
    } else if (g === 1) {
      ns = Math.min(
        W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp((1 - r) * W[14]), s);
    } else {
      const hard = g === 2 ? W[15] : 1;
      const easy = g === 4 ? W[16] : 1;
      ns = s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) *
        (Math.exp((1 - r) * W[10]) - 1) * hard * easy);
    }
    return { s: clamp(ns, S_MIN, 36500), d: nd };
  }
  // Все четыре исхода сразу, с упорядоченными интервалами (как в Anki):
  // Again <= Hard < Good < Easy.
  function options(mem, t, retention) {
    const o = [1, 2, 3, 4].map(g => {
      const m = next(mem, g, t);
      return { g, s: m.s, d: m.d, ivl: interval(m.s, retention) };
    });
    o[0].ivl = Math.min(o[0].ivl, o[1].ivl);
    o[1].ivl = Math.max(o[1].ivl, o[0].ivl + 1);
    o[2].ivl = Math.max(o[2].ivl, o[1].ivl + 1);
    o[3].ivl = Math.max(o[3].ivl, o[2].ivl + 1);
    return o;
  }
  return { next, interval, retrievability, options };
})();

      Array.isArray(c.gaps) && c.gaps.length && c.gaps.every(g => g && typeof g.s === 'string' && Array.isArray(g.a) && g.a.length) &&
      c.tr && typeof c.tr.ru === 'string' && typeof c.tr.en === 'string' &&
      c.free && typeof c.free.q === 'string' && typeof c.free.sample === 'string';
    if (!ok) return 'В колоде есть чанк с неполными данными: ' + (c && c.id || '?');
  }
  return '';
}

// ---------- очередь занятия ----------
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function counts() {
  rollDay();
  const today = dayNum(), chunks = allChunks();
  let due = 0, fresh_ = 0, learning = 0, mature = 0, leech = 0;
  for (const c of chunks) {
    const k = state.cards[c.key];
    if (!k) { fresh_++; continue; }
    if (k.due <= today) due++;
    if (k.lapses >= LEECH) leech++;
    if (k.s >= 21) mature++; else learning++;
  }
  const newLeft = Math.max(0, Math.min(fresh_, state.settings.newPerDay - state.day.introduced));
  return { total: chunks.length, due, fresh: fresh_, learning, mature, leech, newLeft };
}
// Новые чанки берутся по кругу из разных тем, чтобы темы перемешивались.
function pickNew(n) {
  const byTopic = new Map();
  for (const c of allChunks()) {
    if (state.cards[c.key]) continue;
    const t = c.topic || '';
    if (!byTopic.has(t)) byTopic.set(t, []);
    byTopic.get(t).push(c);
  }
  const lists = [...byTopic.values()], out = [];
  for (let i = 0; out.length < n && lists.some(l => l.length); i++) {
    const l = lists[i % lists.length];
    if (l.length) out.push(l.shift());
  }
  return out;
}
function reviewExercise(c, card) {
  const pool = card.s >= MATURE ? ['free', 'tr'] : c.gaps.map((_, i) => 'gap' + i).concat(['tr']);
  const choices = pool.filter(x => x !== card.lastEx);
  return (choices.length ? choices : pool)[Math.floor(Math.random() * (choices.length || pool.length))];
}
function buildSession(extraNew) {
  const today = dayNum(), n = counts();
  const due = allChunks().filter(c => state.cards[c.key] && state.cards[c.key].due <= today)
    .sort((a, b) => state.cards[a.key].due - state.cards[b.key].due).slice(0, state.settings.maxReviews);
  const queue = shuffle(due).map(c => ({ c, kind: reviewExercise(c, state.cards[c.key]), graded: true }));
  const news = pickNew(extraNew ? Math.min(n.fresh, extraNew) : n.newLeft);
  for (const c of news) for (const kind of ['intro', 'notice', 'meaning', 'form']) queue.push({ c, kind });
  for (const c of shuffle(news.slice())) queue.push({ c, kind: 'gap0', graded: true, first: true });
  return { queue, pos: 0, total: queue.length, done: 0, again: 0, introduced: news.length, ratings: [0, 0, 0, 0, 0] };
}

// ---------- оценка ----------
function ratingOptions(c) {
  const card = state.cards[c.key];
  const t = card ? Math.max(0, dayNum() - card.last) : 0;
  return FSRS.options(card ? { s: card.s, d: card.d } : null, t, state.settings.retention);
}
function applyRating(item, g, info) {
  const c = item.c, today = dayNum();
  const prev = state.cards[c.key];
  const o = ratingOptions(c)[g - 1];
  state.cards[c.key] = { s: o.s, d: o.d, last: today, due: today + o.ivl,
    reps: (prev ? prev.reps : 0) + 1, lapses: prev ? prev.lapses + (g === 1 ? 1 : 0) : 0, lastEx: item.kind };
  if (!prev) state.day.introduced++; else state.day.reviewed++;
  state.log.push({ t: Date.now(), k: c.key, ex: item.kind, g, sug: info.suggest || 0, ans: (info.answer || '').slice(0, 300),
    gap: prev ? today - prev.last : 0 });
  if (state.log.length > 5000) state.log.splice(0, state.log.length - 5000);
  save();
}

// ---------- DOM ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const put = (el, ...kids) => { for (const k of kids.flat()) if (k != null && k !== false && k !== '') el.append(k); return el; };
const root = document.getElementById('app');
let view = 'home', session = null, toastTimer = 0;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = h('div', { class: 'toast', role: 'status' }, msg);
  document.body.append(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}
function go(v) { view = v; render(); window.scrollTo(0, 0); }
function header() {
  const tab = (id, label) => h('button', { 'aria-current': view === id ? 'page' : null, onclick: () => { session = null; go(id); } }, label);
  return h('header', { class: 'top' }, h('div', { class: 'brand' }, 'Чанки'),
    h('nav', {}, tab('home', 'Сегодня'), tab('sheet', 'Шпаргалка'), tab('settings', 'Настройки')));
}
function render() {
  root.replaceChildren();
  if (view === 'session' && session) { put(root, renderSession()); return; }
  put(root, header());
  if (!storageOk) put(root, h('div', { class: 'banner' }, 'Браузер не даёт сохранять данные в этом режиме. Прогресс пропадёт при закрытии страницы: сохраните его файлом в настройках.'));
  put(root, view === 'sheet' ? renderSheet() : view === 'settings' ? renderSettings() : view === 'summary' ? renderSummary() : renderHome());
}

// ---------- главный экран ----------
function nextDueText() {
  const today = dayNum();
  const dues = Object.values(state.cards).map(k => k.due).filter(d => d > today);
  if (!dues.length) return '';
  const n = Math.min(...dues) - today;
  return n === 1 ? 'Следующее повторение завтра.' : 'Следующее повторение через ' + n + ' ' + plural(n, 'день', 'дня', 'дней') + '.';
}
function renderHome() {
  const n = counts(), todo = n.due + n.newLeft;
  const box = h('div', {});
  put(box, h('h1', {}, todo ? 'На сегодня ' + todo + ' ' + plural(todo, 'чанк', 'чанка', 'чанков') : 'На сегодня всё'));
  put(box, h('p', { class: 'muted' }, todo
    ? n.due + ' к повторению, ' + n.newLeft + ' ' + plural(n.newLeft, 'новый', 'новых', 'новых') + '. Сначала повторение, потом знакомство с новыми.'
    : (nextDueText() || 'Все чанки колоды уже в работе.')));
  put(box, h('div', { class: 'actions' },
    todo ? h('button', { class: 'btn primary block', onclick: () => start(0) }, 'Начать занятие') : null,
    !todo && n.fresh ? h('button', { class: 'btn block', onclick: () => start(state.settings.newPerDay) },
      'Взять ещё ' + Math.min(n.fresh, state.settings.newPerDay) + ' ' + plural(Math.min(n.fresh, state.settings.newPerDay), 'новый', 'новых', 'новых')) : null));
  put(box, h('h2', {}, 'Колода'));
  const stat = (v, l) => h('div', { class: 'stat' }, h('b', {}, v), h('span', {}, l));
  put(box, h('div', { class: 'stats' }, stat(n.fresh, 'ещё не начаты'), stat(n.learning, 'в работе'),
    stat(n.mature, 'закреплены'), stat(n.leech, 'трудные')));
  put(box, h('p', { class: 'small muted' }, 'Всего ' + n.total + ' ' + plural(n.total, 'чанк', 'чанка', 'чанков') + ' в ' +
    allDecks().length + ' ' + plural(allDecks().length, 'колоде', 'колодах', 'колодах') + '. Расписание считает алгоритм FSRS, как в Anki.'));
  return box;
}
function start(extra) {
  session = buildSession(extra);
  if (!session.queue.length) { session = null; toast('Сейчас нечего повторять.'); return; }
  go('session');
}

// ---------- занятие ----------
const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/[.,!?;:—–-]+$/g, '').replace(/\s+/g, ' ').trim();
function speakBtn(text) {
  const native = window.Android && Android.speak;
  if (!native && !('speechSynthesis' in window)) return null;
  return h('button', { class: 'btn ghost', type: 'button', onclick: () => {
    if (native) { Android.speak(text); return; }
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.95; speechSynthesis.speak(u); } catch (e) {}
  } }, 'Прослушать');
}
function errNote(c) { return c.err ? h('div', { class: 'note' }, h('b', {}, 'Типичная ошибка: '), c.err) : null; }
function advance(requeue) {
  const item = session.queue[session.pos];
  if (requeue) {
    const again = { c: item.c, kind: retryKind(item), retry: (item.retry || 0) + 1 };
    session.queue.splice(Math.min(session.queue.length, session.pos + 4), 0, again);
    session.total++;
  }
  session.pos++; session.done++;
  if (session.pos >= session.queue.length) { go('summary'); return; }
  render(); window.scrollTo(0, 0);
}
function retryKind(item) {
  const kinds = item.c.gaps.map((_, i) => 'gap' + i).filter(k => k !== item.kind);
  return kinds.length ? kinds[0] : 'gap0';
}
function renderSession() {
  const item = session.queue[session.pos], c = item.c;
  const wrap = h('div', {});
  put(wrap, h('div', { class: 'row', style: 'justify-content:space-between;align-items:center;margin-bottom:10px' },
    h('span', { class: 'small muted' }, (session.done + 1) + ' из ' + session.total),
    h('button', { class: 'btn ghost', onclick: () => { session = null; go('home'); } }, 'Закончить')));
  put(wrap, h('div', { class: 'progress' }, h('i', { style: 'width:' + Math.round(100 * session.done / session.total) + '%' })));
  const card = h('div', { class: 'card' });
  put(wrap, card);
  const fn = { intro: exIntro, notice: exNotice, meaning: exMeaning, form: exForm, tr: exOpen, free: exOpen }[item.kind] || exGap;
  fn(card, item, c);
  return wrap;
}
function nextBtn(label, onclick, primary = true) {
  return h('button', { class: 'btn block' + (primary ? ' primary' : ''), onclick }, label);
}

// Знакомство: чанк с примерами, без нагрузки.
function exIntro(card, item, c) {
  put(card, h('div', { class: 'stage' }, 'Новый чанк'),
    h('div', { class: 'chunk', lang: 'en' }, c.en), h('div', { class: 'ru' }, c.ru),
    h('ul', { class: 'examples', lang: 'en' }, c.ex.map(e => h('li', {}, e))),
    errNote(c),
    h('div', { class: 'actions' }, nextBtn('Понятно, дальше', () => advance()), speakBtn(c.en + '. ' + c.ex[0])));
}
// Этап 1: заметить чанк в предложении.
function exNotice(card, item, c) {
  const m = c.ctx.match(/^(.*?)\[(.+?)\](.*)$/);
  const parts = [[m[1], false], [m[2], true], [m[3], false]];
  const toks = [];
  for (const [text, target] of parts) for (const w of text.split(/\s+/).filter(Boolean)) toks.push({ w, target });
  const line = h('div', { class: 'tokens', lang: 'en' });
  let checked = false;
  toks.forEach(t => {
    t.el = h('button', { class: 'tok word', type: 'button', onclick: () => { if (checked) return; t.sel = !t.sel; t.el.classList.toggle('sel', t.sel); btn.disabled = !toks.some(x => x.sel); } }, t.w);
    put(line, t.el, ' ');
  });
  const out = h('div', {});
  const btn = nextBtn('Проверить', () => {
    if (checked) { advance(); return; }
    checked = true;
    const ok = toks.every(t => !!t.sel === t.target);
    toks.forEach(t => { t.el.classList.remove('sel'); if (t.target) t.el.classList.add('right'); else if (t.sel) t.el.classList.add('wrong'); });
    put(out, h('div', { class: 'verdict ' + (ok ? 'ok' : 'no') }, ok ? 'Верно.' : 'Выражение выделено зелёным.'),
      h('div', { class: 'muted' }, c.en + ' — ' + c.ru));
    btn.textContent = 'Дальше';
  });
  btn.disabled = true;
  put(card, h('div', { class: 'stage' }, 'Заметить'), h('div', { class: 'task' }, 'Найдите в предложении выражение со значением «' + c.ru + '». Нажмите на его слова.'),
    line, out, h('div', { class: 'actions' }, btn));
}
// Варианты одной формы: проверка выбором.
function choice(card, stage, task, body, options, correct, after) {
  const out = h('div', {}), list = h('div', { class: 'opts' });
  let done = false;
  const next = nextBtn('Дальше', () => advance()); next.disabled = true;
  shuffle(options.slice()).forEach(o => {
    const b = h('button', { class: 'opt', type: 'button', onclick: () => {
      if (done) return; done = true;
      list.querySelectorAll('.opt').forEach(x => { if (x.dataset.v === correct) x.classList.add('right'); });
      if (o !== correct) b.classList.add('wrong');
      put(out, h('div', { class: 'verdict ' + (o === correct ? 'ok' : 'no') }, o === correct ? 'Верно.' : 'Правильный вариант выделен.'), after || '');
      next.disabled = false; next.focus();
    } }, o);
    b.dataset.v = o; list.append(b);
  });
  put(card, h('div', { class: 'stage' }, stage), h('div', { class: 'task' }, task), body, list, out, h('div', { class: 'actions' }, next));
}
// Этап 2: понять значение.
function exMeaning(card, item, c) {
  choice(card, 'Понять', 'Что значит это выражение?', h('div', { class: 'chunk', lang: 'en' }, c.en), [c.ru].concat(c.mean.slice(0, 2)), c.ru);
}
// Этап 3: разобрать форму.
function exForm(card, item, c) {
  choice(card, 'Собрать', 'Какое слово подходит?', h('p', { class: 'en', lang: 'en' }, c.form.s.replace('___', '_____')),
    [c.form.a].concat(c.form.d.slice(0, 2)), c.form.a, errNote(c));
}
// Подставить ответ в пропуск; в начале предложения с заглавной буквы.
function fill(s, a) {
  return s.replace(/(^|[.!?—]\s+)?___/, (m, pre) => pre !== undefined ? pre + a[0].toUpperCase() + a.slice(1) : a);
}
// Кнопки оценки с интервалами, как в Anki.
function rateBar(item, suggest, info, legend) {
  const opts = ratingOptions(item.c);
  const bar = h('div', { class: 'rate' });
  opts.forEach(o => {
    put(bar, h('button', { class: 'g' + o.g + (o.g === suggest ? ' suggest' : ''), type: 'button', onclick: () => {
      session.ratings[o.g]++;
      applyRating(item, o.g, Object.assign({ suggest }, info));
      if (o.g === 1) session.again++;
      advance(o.g === 1);
    } }, h('b', {}, GRADES[o.g]), h('span', {}, fmtIvl(o.ivl))));
  });
  return h('div', {}, bar, h('div', { class: 'legend' }, legend));
}
// Этап 4: контролируемое применение, проверяется автоматически.
function exGap(card, item, c) {
  const g = c.gaps[Number(item.kind.slice(3)) || 0] || c.gaps[0];
  const input = h('input', { type: 'text', lang: 'en', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'Ваш ответ' });
  const out = h('div', {}), hintBox = h('div', { class: 'small muted', style: 'margin-top:8px' });
  let hinted = false, done = false;
  const check = nextBtn('Проверить', () => {
    if (done || !input.value.trim()) return;
    done = true; input.disabled = true; check.remove(); hintBtn.remove();
    const ok = g.a.some(a => norm(a) === norm(input.value));
    put(out, h('div', { class: 'verdict ' + (ok ? 'ok' : 'no') }, ok ? 'Верно.' : 'Не совсем.'),
      h('div', { class: 'model', lang: 'en' }, h('span', { class: 'lbl' }, 'Полностью'), h('span', { class: 'en' }, fill(g.s, g.a[0]))),
      ok ? null : errNote(c));
    if (item.retry) {
      // Повтор после Again: расписание уже посчитано, нужно только ответить верно.
      const again = !ok && item.retry < 3;
      put(out, h('div', { class: 'actions' }, nextBtn(again ? 'Ещё раз позже' : 'Дальше', () => advance(again))));
    } else {
      put(out, rateBar(item, ok ? (hinted ? 2 : 3) : 1, { answer: input.value },
        'Предложенная оценка обведена, её можно сменить. Под кнопкой срок следующего повторения. После Again чанк вернётся ещё раз в этом занятии.'));
    }
  });
  const hintBtn = h('button', { class: 'btn ghost', type: 'button', onclick: () => {
    hinted = true; hintBox.textContent = 'Первые буквы: ' + g.a[0].split(' ').map(w => w[0] + '…').join(' ');
  } }, 'Подсказка');
  input.addEventListener('keydown', e => { if (e.key === 'Enter') check.click(); });
  put(card, h('div', { class: 'stage' }, item.retry ? 'Ещё раз' : 'Применить'),
    h('div', { class: 'task' }, 'Впишите выражение: «' + g.ru + '».'),
    h('p', { class: 'en', lang: 'en' }, g.s.replace('___', '_____')), input, hintBox, out,
    h('div', { class: 'actions' }, check, hintBtn));
  setTimeout(() => input.focus(), 0);
}
// Этап 4–5: перевод и свободный ответ, сверка с образцом своими глазами.
function exOpen(card, item, c) {
  const free = item.kind === 'free';
  const area = h('textarea', { lang: 'en', autocapitalize: 'sentences', spellcheck: 'false', 'aria-label': 'Ваш ответ' });
  const out = h('div', {});
  let done = false;
  const show = nextBtn('Показать образец', () => {
    if (done) return; done = true; area.disabled = true; show.remove();
    put(out, h('div', { class: 'model', lang: 'en' }, h('span', { class: 'lbl' }, free ? 'Возможный ответ' : 'Образец'),
        h('span', { class: 'en' }, free ? c.free.sample : c.tr.en)),
      h('p', { class: 'small muted', style: 'margin-top:10px' }, 'Нужное выражение: ', h('b', { lang: 'en' }, c.en),
        '. Сравните свой ответ с образцом: важно, чтобы выражение стояло в верной форме.'),
      errNote(c),
      rateBar(item, 0, { answer: area.value },
        'Оцените сами. Again: не вспомнили выражение. Hard: вспомнили с ошибкой или с трудом. Good: верно. Easy: сразу и без усилий. Под кнопкой срок следующего повторения.'));
  });
  put(card, h('div', { class: 'stage' }, free ? 'Свободный ответ' : 'Перевод'),
    h('div', { class: 'task' }, free ? 'Ответьте по-английски одним-двумя предложениями. Вам понадобится выражение со значением «' + c.ru + '».'
      : 'Переведите на английский. Вам понадобится выражение со значением «' + c.ru + '».'),
    h('p', { class: 'ru' }, free ? c.free.q : c.tr.ru), area, out, h('div', { class: 'actions' }, show));
  setTimeout(() => area.focus(), 0);
}

// ---------- итог ----------
function renderSummary() {
  const s = session || { ratings: [0, 0, 0, 0, 0], introduced: 0 };
  const rated = s.ratings.reduce((a, b) => a + b, 0);
  const box = h('div', {}, h('h1', {}, 'Занятие окончено'),
    h('p', { class: 'muted' }, 'Оценено ' + rated + ' ' + plural(rated, 'ответ', 'ответа', 'ответов') + ', новых чанков: ' + s.introduced + '. ' + nextDueText()));
  const stat = (v, l) => h('div', { class: 'stat' }, h('b', {}, v), h('span', {}, l));
  put(box, h('div', { class: 'stats' }, stat(s.ratings[1], 'Again'), stat(s.ratings[2], 'Hard'), stat(s.ratings[3], 'Good'), stat(s.ratings[4], 'Easy')));
  put(box, h('div', { class: 'actions' }, nextBtn('На главную', () => { session = null; go('home'); })));
  return box;
}

// ---------- шпаргалка ----------
function renderSheet() {
  const today = dayNum(), box = h('div', {}, h('h1', {}, 'Шпаргалка'),
    h('p', { class: 'muted' }, 'Все чанки по темам. Нажмите на чанк, чтобы увидеть примеры и типичную ошибку.'));
  const topics = new Map();
  for (const c of allChunks()) { const t = c.topic || 'Без темы'; if (!topics.has(t)) topics.set(t, []); topics.get(t).push(c); }
  for (const [t, list] of topics) {
    const sec = h('div', { class: 'topic' }, h('h2', {}, t));
    for (const c of list) {
      const k = state.cards[c.key];
      const chip = !k ? h('span', { class: 'chip' }, 'новый')
        : k.lapses >= LEECH ? h('span', { class: 'chip leech' }, 'трудный')
        : k.due <= today ? h('span', { class: 'chip due' }, 'сегодня')
        : h('span', { class: 'chip' }, 'через ' + fmtIvl(k.due - today));
      put(sec, h('details', { class: 'item' },
        h('summary', {}, h('span', {}, h('span', { class: 'e', lang: 'en' }, c.en), h('br'), h('span', { class: 'r' }, c.ru)), chip),
        h('ul', { class: 'examples', lang: 'en', style: 'margin-top:10px' }, c.ex.map(e => h('li', {}, e))),
        errNote(c),
        h('p', { class: 'small muted', style: 'margin-top:10px' }, 'Источник: ' + (c.deck.source || c.deck.title || c.deck.id) + (c.lesson ? ', урок ' + c.lesson : '') +
          (k ? '. Повторений: ' + k.reps + ', срывов: ' + k.lapses + '.' : '.'))));
    }
    put(box, sec);
  }
  return box;
}

// ---------- настройки и данные ----------
function download(name, obj) {
  // В приложении для Android файл сохраняется через системный диалог.
  if (window.Android && Android.saveFile) { Android.saveFile(name, JSON.stringify(obj, null, 1)); return; }
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }));
  const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function pickFile(cb) {
  const inp = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { cb(JSON.parse(String(r.result))); } catch (e) { toast('Файл не читается: это не JSON.'); } };
    r.readAsText(f);
  });
  document.body.append(inp); inp.click(); setTimeout(() => inp.remove(), 60000);
}
function renderSettings() {
  const s = state.settings, box = h('div', {}, h('h1', {}, 'Настройки'));
  const num = (label, key, min, max, hint) => {
    const inp = h('input', { type: 'number', min, max, inputmode: 'numeric', value: s[key] });
    inp.addEventListener('change', () => { const v = Math.round(Number(inp.value)); s[key] = Math.min(max, Math.max(min, isFinite(v) ? v : s[key])); inp.value = s[key]; save(); toast('Сохранено'); });
    return h('div', { class: 'field' }, h('label', {}, label), inp, h('div', { class: 'hint' }, hint));
  };
  const sel = h('select', {}, [0.85, 0.9, 0.95].map(v => h('option', { value: v, selected: Math.abs(s.retention - v) < 0.001 }, Math.round(v * 100) + '%')));
  sel.addEventListener('change', () => { s.retention = Number(sel.value); save(); toast('Сохранено'); });
  put(box, h('h2', {}, 'Нагрузка'),
    num('Новых чанков в день', 'newPerDay', 0, 50, 'По умолчанию 5. Каждый новый чанк добавляет повторения в следующие дни.'),
    num('Повторений за занятие, не больше', 'maxReviews', 5, 500, 'Если накопилось больше, остальное перейдёт на следующее занятие.'),
    h('div', { class: 'field' }, h('label', {}, 'Желаемое удержание'), sel,
      h('div', { class: 'hint' }, 'С какой вероятностью вы должны помнить чанк к моменту повторения. 85%: меньше повторений. 95%: надёжнее, но повторений заметно больше.')));
  put(box, h('h2', {}, 'Прогресс'), h('p', { class: 'small muted' }, 'Прогресс хранится в этом браузере. Сохраняйте его файлом, чтобы перенести на другое устройство или не потерять при очистке браузера.'),
    h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: () => download('chunks-progress-' + dayKey() + '.json', { format: 'chunk-progress/1', exported: new Date().toISOString(), state }) }, 'Сохранить в файл'),
      h('button', { class: 'btn', onclick: () => pickFile(d => {
        if (!d || d.format !== 'chunk-progress/1' || !d.state || typeof d.state.cards !== 'object') { toast('Это не файл прогресса.'); return; }
        if (!confirm('Заменить текущий прогресс данными из файла?')) return;
        state = Object.assign(fresh(), d.state); state.settings = Object.assign(fresh().settings, d.state.settings || {});
        for (const [id, deck] of Object.entries(state.decks || {})) if (validDeck(deck)) delete state.decks[id];
        save(); render(); toast('Прогресс загружен');
      }) }, 'Загрузить из файла')));
  put(box, h('h2', {}, 'Колоды'));
  for (const d of allDecks()) {
    const mine = d !== BUILTIN;
    put(box, h('div', { class: 'row', style: 'justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 0' },
      h('div', {}, h('div', {}, d.title || d.id), h('div', { class: 'small muted' }, d.chunks.length + ' ' + plural(d.chunks.length, 'чанк', 'чанка', 'чанков') + (mine ? '' : ', встроенная'))),
      mine ? h('button', { class: 'btn ghost', onclick: () => { if (confirm('Удалить колоду «' + (d.title || d.id) + '» и её прогресс?')) {
        delete state.decks[d.id]; for (const k of Object.keys(state.cards)) if (k.startsWith(d.id + '/')) delete state.cards[k]; save(); render(); } } }, 'Удалить') : null));
  }
  put(box, h('div', { class: 'row', style: 'margin-top:10px' },
    h('button', { class: 'btn', onclick: () => pickFile(d => {
      const err = validDeck(d); if (err) { toast(err); return; }
      if (d.id === BUILTIN.id) { toast('Колода с таким идентификатором уже встроена.'); return; }
      state.decks[d.id] = d; save(); render(); toast('Колода добавлена: ' + d.chunks.length + ' ' + plural(d.chunks.length, 'чанк', 'чанка', 'чанков'));
    }) }, 'Добавить колоду из файла'),
    h('button', { class: 'btn', onclick: () => download('deck-' + BUILTIN.id + '.json', BUILTIN) }, 'Скачать образец колоды')));
  put(box, h('h2', {}, 'Сброс'), h('button', { class: 'btn', onclick: () => {
    if (!confirm('Стереть весь прогресс? Колоды останутся.')) return;
    state.cards = {}; state.log = []; state.day = { date: '', introduced: 0, reviewed: 0 }; save(); render(); toast('Прогресс стёрт');
  } }, 'Начать заново'));
  return box;
}

// Кнопка «Назад» в приложении для Android: с любого экрана на главный, с главного наружу.
window.appBack = () => { if (view === 'home') return false; session = null; go('home'); return true; };
rollDay(); save(); render();
})();
</script>
</body>
</html>
