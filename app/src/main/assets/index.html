<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Чанки</title>
<style>
:root{
  --bg:#f3f7fc; --surface:#ffffff; --ink:#0a1f3d; --muted:#5a6b85; --line:#dce5f0;
  --accent:#1b4fe0; --accent-ink:#ffffff; --soft:#e6eefd; --sky:#58b4ff;
  --again:#c2412f; --hard:#a26a00; --good:#0f7b6c; --easy:#1b4fe0;
  --bad-soft:#fbe6e2; --good-soft:#dff3ee; --mark:#cfe2ff;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#071120; --surface:#0e1b30; --ink:#e9f0fc; --muted:#8c9db8; --line:#1d2c45;
    --accent:#7aa7ff; --accent-ink:#06132a; --soft:#14284a; --sky:#8fd0ff;
    --again:#ff8f80; --hard:#e6b450; --good:#5fd0bd; --easy:#7aa7ff;
    --bad-soft:#3a1d1a; --good-soft:#0f302b; --mark:#1f3f78;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.app{max-width:560px;margin:0 auto;padding:24px 20px 112px}
.app.bare{padding-bottom:40px}
h1{font-weight:300;font-size:32px;line-height:1.15;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
h2{font-size:15px;font-weight:600;color:var(--ink);margin:32px 0 12px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}

/* кольца прогресса */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .track{stroke:var(--line);fill:none}
.ring .arc{fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.hero{display:grid;justify-items:center;gap:6px;margin:18px 0 26px}
.hero .num{font-weight:200;font-size:72px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .cap{font-size:14px;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:30px 0 8px}
.trio .cell{display:grid;justify-items:center;gap:8px;text-align:center}
.trio .val{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.trio .lbl{font-size:13px;color:var(--muted);line-height:1.3}
.mini .val{font-size:10px;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:10px 22px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);font-weight:500;min-height:42px}
.btn.quiet{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.actions{margin-top:20px;display:grid;gap:8px}

.card{background:var(--surface);border-radius:24px;padding:24px 22px;border:1px solid var(--line)}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sbar .left{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:10px}
.task{font-size:15px;color:var(--muted);margin-bottom:14px}
.chunk{font-family:var(--serif);font-size:32px;line-height:1.15;margin:4px 0 6px;overflow-wrap:anywhere}
.ru{font-size:18px;margin-bottom:14px}
.en{font-family:var(--serif);font-size:20px;line-height:1.5}
ul.examples{list-style:none;margin:0 0 6px;padding:0}
ul.examples li{font-family:var(--serif);font-size:18px;line-height:1.5;padding:10px 0;border-top:1px solid var(--line)}
.note{font-size:14px;background:var(--soft);border-radius:12px;padding:10px 14px;margin:14px 0 0;color:var(--muted)}
.note b{color:var(--ink);font-weight:600}
.tokens{font-family:var(--serif);font-size:22px;line-height:1.9;margin-bottom:16px}
.tok{display:inline-block;padding:0 4px;margin:0;border-radius:7px;border:0;background:none;font:inherit;color:inherit}
.tok.sel{background:var(--mark)}
.tok.right{background:var(--good-soft);color:var(--good)}
.tok.wrong{background:var(--bad-soft)}
.opts{display:grid;gap:10px;margin:14px 0 8px}
.opt{text-align:left;min-height:54px;padding:12px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:17px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--again);background:var(--bad-soft)}
input[type=text],textarea,input[type=number],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{min-height:92px;resize:vertical}
textarea.en,input.en{font-family:var(--serif);font-size:19px}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.verdict{font-weight:600;margin:14px 0 6px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--again)}
.model{background:var(--soft);border-radius:14px;padding:12px 16px;margin:8px 0 4px}
.lbl{font-size:13px;color:var(--muted);display:block;margin-bottom:2px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 4px;min-height:62px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rate button b{font-size:15px;font-weight:600}
.rate button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rate .g1 b{color:var(--again)} .rate .g2 b{color:var(--hard)} .rate .g3 b{color:var(--good)} .rate .g4 b{color:var(--easy)}
.rate button.suggest{border-width:2px;border-color:currentColor}
.rate .g1.suggest{color:var(--again)} .rate .g2.suggest{color:var(--hard)} .rate .g3.suggest{color:var(--good)} .rate .g4.suggest{color:var(--easy)}
.legend{font-size:13px;color:var(--muted);margin-top:10px}

/* списки */
.list{border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line);padding:14px 0}
.item summary,.item .head{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center}
.item summary::-webkit-details-marker{display:none}
.item .txt{flex:1;min-width:0}
.item .e{font-family:var(--serif);font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.item .r{font-size:14px;color:var(--muted)}
.item .when{flex:none;font-size:12px;color:var(--muted);white-space:nowrap}
.item .when.due{color:var(--accent);font-weight:600}
.item .when.leech{color:var(--again)}
.chips{display:flex;gap:8px;margin:16px 0 14px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field .hint{font-size:13px;color:var(--muted);margin-top:6px}
.banner{background:var(--bad-soft);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:16px}

/* чтение */
.reader{font-family:var(--serif);font-size:20px;line-height:1.7}
.reader p{margin:0 0 18px}
.reader .s{border-radius:6px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:1px 0}
.reader .s.on{background:var(--mark)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(10,31,61,.14);max-height:72vh;overflow:auto}
.sheet .inner{max-width:560px;margin:0 auto;padding:18px 20px calc(18px + env(safe-area-inset-bottom))}
.sheet .tokens{font-size:20px;line-height:1.8;margin-bottom:8px}
.sheet .tr{font-size:16px;margin:4px 0 12px}
.sheet .x{position:sticky;top:0;float:right;border:0;background:var(--soft);border-radius:999px;width:36px;height:36px;font-size:18px;line-height:1;color:var(--muted)}

/* нижняя панель */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 2px;font-size:11px;color:var(--muted);border-radius:14px}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (max-width:380px){.chunk{font-size:27px}.hero .num{font-size:60px}.rate button b{font-size:14px}}
@media (prefers-reduced-motion:reduce){.ring .arc{transition:none}}
</style>
</head>

// FSRS-6 с параметрами по умолчанию (те же, что в ts-fsrs 5.x / современном Anki).
const FSRS = (() => {
  const W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796,
    1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
  const DECAY = -W[20];
  const FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
  const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
  const S_MIN = 0.001;

  // Вероятность вспомнить через t дней при стабильности s.
  const retrievability = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);
  // Интервал в днях, при котором вероятность вспомнить упадёт до retention.
  const interval = (s, retention) =>
    clamp(Math.round(s / FACTOR * (Math.pow(retention, 1 / DECAY) - 1)), 1, 36500);
  const initDifficulty = g => W[4] - Math.exp((g - 1) * W[5]) + 1;

  // mem: {s, d} или null для новой карточки; g: 1 Again, 2 Hard, 3 Good, 4 Easy; t: прошло дней.
  function next(mem, g, t) {
    if (!mem || !mem.s) {
      return { s: Math.max(W[g - 1], 0.1), d: clamp(initDifficulty(g), 1, 10) };
    }
    const { s, d } = mem;
    const r = retrievability(t, s);
    const damped = d + (-W[6] * (g - 3)) * (10 - d) / 9;
    const nd = clamp(W[7] * initDifficulty(4) + (1 - W[7]) * damped, 1, 10);
    let ns;
    if (t < 1) {
      const sinc = Math.pow(s, -W[19]) * Math.exp(W[17] * (g - 3 + W[18]));
      ns = s * (g >= 2 ? Math.max(sinc, 1) : sinc);
    } else if (g === 1) {
      ns = Math.min(
        W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp((1 - r) * W[14]), s);
    } else {
      const hard = g === 2 ? W[15] : 1;
      const easy = g === 4 ? W[16] : 1;
      ns = s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) *
        (Math.exp((1 - r) * W[10]) - 1) * hard * easy);
    }
    return { s: clamp(ns, S_MIN, 36500), d: nd };
  }
  // Все четыре исхода сразу, с упорядоченными интервалами (как в Anki):
  // Again <= Hard < Good < Easy.
  function options(mem, t, retention) {
    const o = [1, 2, 3, 4].map(g => {
      const m = next(mem, g, t);
      return { g, s: m.s, d: m.d, ivl: interval(m.s, retention) };
    });
    o[0].ivl = Math.min(o[0].ivl, o[1].ivl);
    o[1].ivl = Math.max(o[1].ivl, o[0].ivl + 1);
    o[2].ivl = Math.max(o[2].ivl, o[1].ivl + 1);
    o[3].ivl = Math.max(o[3].ivl, o[2].ivl + 1);
    return o;
  }
  return { next, interval, retrievability, options };
})();

function openSheet(text, sentence, onClose) {
  document.querySelectorAll('.sheet').forEach(x => x.remove());

    const mean = h('input', { type: 'text', 'aria-label': 'Перевод', value: ru ? sel : (whole ? sentenceTr : '') , placeholder: 'Перевод' });

      save(); toast(/\s/.test(en) ? 'Выражение добавлено' : 'Слово добавлено');
      a = b = -1; els.forEach(el => el.classList.remove('sel')); drawForm();
    } }, whole ? 'Учить всё предложение' : 'Добавить в изучение');
    put(form, h('p', { class: 'small muted' }, whole ? 'Нажмите на слова, чтобы выбрать слово или выражение. Или добавьте предложение целиком.'

      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Учить'), learn),

    });
  } else {
    put(trLine, 'Автоперевод работает в приложении для Android. Здесь впишите перевод сами или ',
      h('a', { href: 'https://translate.google.com/?sl=' + from + '&tl=' + to + '&text=' + encodeURIComponent(sentence), target: '_blank', rel: 'noopener' }, 'откройте переводчик'), '.');
  }

function download(name, obj) {

  if (window.Android && Android.saveFile) { Android.saveFile(name, JSON.stringify(obj, null, 1)); return; }
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }));
  const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function pickFile(cb) {

  inp.addEventListener('change', () => {

    r.onload = () => { try { cb(JSON.parse(String(r.result))); } catch (e) { toast('Файл не читается: это не JSON.'); } };
    r.readAsText(f);
  });
  document.body.append(inp); inp.click(); setTimeout(() => inp.remove(), 60000);
}

  const s = state.settings, box = h('div', {}, h('h1', {}, 'Настройки'));
  const num = (label, key, min, max, hint) => {
    const inp = h('input', { type: 'number', min, max, inputmode: 'numeric', value: s[key] });
    inp.addEventListener('change', () => { const v = Math.round(Number(inp.value)); s[key] = Math.min(max, Math.max(min, isFinite(v) ? v : s[key])); inp.value = s[key]; save(); toast('Сохранено'); });
    return h('div', { class: 'field' }, h('label', {}, label), inp, h('div', { class: 'hint' }, hint));
  };
  const sel = h('select', {}, [0.85, 0.9, 0.95].map(v => h('option', { value: v, selected: Math.abs(s.retention - v) < 0.001 }, Math.round(v * 100) + '%')));
  sel.addEventListener('change', () => { s.retention = Number(sel.value); save(); toast('Сохранено'); });
  put(box, h('h2', {}, 'Нагрузка'),
    num('Новых в день', 'newPerDay', 0, 50, 'По умолчанию 5. Каждая новая карточка добавляет повторения в следующие дни.'),
    num('Повторений за занятие, не больше', 'maxReviews', 5, 500, 'Если накопилось больше, остальное перейдёт на следующее занятие.'),
    h('div', { class: 'field' }, h('label', {}, 'Желаемое удержание'), sel,
      h('div', { class: 'hint' }, 'С какой вероятностью вы должны помнить карточку к моменту повторения. 85%: меньше повторений. 95%: надёжнее, но повторений заметно больше.')));
  put(box, h('h2', {}, 'Прогресс'), h('p', { class: 'small muted' }, 'Прогресс, тексты и свои слова хранятся на этом устройстве. Сохраняйте их файлом, чтобы перенести на другое устройство или не потерять.'),
    h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: () => download('chunks-progress-' + dayKey() + '.json', { format: 'chunk-progress/1', exported: new Date().toISOString(), state }) }, 'Сохранить в файл'),
      h('button', { class: 'btn', onclick: () => pickFile(d => {
        if (!d || d.format !== 'chunk-progress/1' || !d.state || typeof d.state.cards !== 'object') { toast('Это не файл прогресса.'); return; }
        if (!confirm('Заменить текущий прогресс данными из файла?')) return;
        state = adopt(d.state);
        for (const [id, deck] of Object.entries(state.decks)) if (validDeck(deck)) delete state.decks[id];
        state.my = state.my.filter(m => m && typeof m.en === 'string' && typeof m.ru === 'string' && typeof m.id === 'string');
        state.texts = state.texts.filter(t => t && typeof t.body === 'string' && typeof t.title === 'string' && typeof t.id === 'string');
        save(); render(); toast('Прогресс загружен');
      }) }, 'Загрузить из файла')));
  put(box, h('h2', {}, 'Колоды'));
  const list = h('div', { class: 'list' });
  for (const d of allDecks()) {
    const removable = d !== BUILTIN && !d.mine;
    put(list, h('div', { class: 'item' }, h('div', { class: 'head', style: 'cursor:default' },
      h('div', { class: 'txt' }, h('div', {}, d.title || d.id), h('div', { class: 'r' }, d.chunks.length + ' ' + plural(d.chunks.length, 'карточка', 'карточки', 'карточек') + (d === BUILTIN ? ', встроенная' : ''))),
      removable ? h('button', { class: 'btn ghost quiet', onclick: () => { if (confirm('Удалить колоду «' + (d.title || d.id) + '» и её прогресс?')) {
        delete state.decks[d.id]; for (const k of Object.keys(state.cards)) if (k.startsWith(d.id + '/')) delete state.cards[k]; save(); render(); } } }, 'Удалить') : null)));
  }
  put(box, list, h('div', { class: 'row', style: 'margin-top:14px' },
    h('button', { class: 'btn', onclick: () => pickFile(d => {
      const err = validDeck(d); if (err) { toast(err); return; }
      if (d.id === BUILTIN.id) { toast('Колода с таким идентификатором уже встроена.'); return; }
      state.decks[d.id] = d; save(); render(); toast('Колода добавлена: ' + d.chunks.length);
    }) }, 'Добавить колоду из файла'),
    h('button', { class: 'btn', onclick: () => download('deck-' + BUILTIN.id + '.json', BUILTIN) }, 'Скачать образец колоды')));
  put(box, h('h2', {}, 'Сброс'), h('button', { class: 'btn', onclick: () => {
    if (!confirm('Стереть весь прогресс? Колоды, тексты и свои слова останутся.')) return;
    state.cards = {}; state.log = []; state.day = { date: '', introduced: 0, reviewed: 0 }; save(); render(); toast('Прогресс стёрт');
  } }, 'Начать заново'));
  return box;
}

// Кнопка «Назад» в приложении для Android.
window.appBack = () => {
  const sheet = document.querySelector('.sheet .x');
  if (sheet) { sheet.click(); return true; }
  if (view === 'home') return false;
  if (view === 'read') { reading = null; go('texts'); return true; }
  session = null; go('home'); return true;
};
rollDay(); save(); render();
})();
</script>
</body>
</html>
