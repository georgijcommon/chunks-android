plugins {
    id 'com.android.application'
}

android {
    namespace 'app.chunks.trainer'
    compileSdk 34

    defaultConfig {
        applicationId 'app.chunks.trainer'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '2.0'
        // Только процессоры настоящих телефонов: без этого APK вдвое больше.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Один и тот же ключ подписи при каждой сборке: новая версия ставится
    // поверх старой, и прогресс в приложении сохраняется.
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Перевод на самом устройстве: модель скачивается один раз, дальше работает без сети.
    implementation 'com.google.mlkit:translate:17.0.3'
}
