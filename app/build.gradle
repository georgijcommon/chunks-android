plugins {
    id 'com.android.application'
}

android {
    namespace 'app.chunks.trainer'
    compileSdk 34

    defaultConfig {
        applicationId 'app.chunks.trainer'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Один и тот же ключ подписи при каждой сборке: новая версия ставится
    // поверх старой, и прогресс в приложении сохраняется.
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
