name: Build APK

on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle --no-daemon assembleDebug

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk chunks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chunks-apk
          path: chunks.apk

      # Свежий APK всегда лежит в релизе «latest»: его удобно скачать прямо с телефона.
      - name: Publish latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest chunks.apk --title "Чанки, сборка ${{ github.run_number }}" --notes "Автоматическая сборка из коммита ${{ github.sha }}."

      # Ветка release/X.Y фиксирует версию: релиз vX.Y создаётся один раз и больше не меняется.
      - name: Publish frozen version
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#release/}"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Релиз v$V уже существует, не трогаю."
          else
            cp chunks.apk "chunks-v$V.apk"
            cp app/src/main/assets/index.html "chunks-v$V.html"
            gh release create "v$V" "chunks-v$V.apk" "chunks-v$V.html" --target "${{ github.sha }}" --title "Чанки $V (зафиксированная версия)" --notes "Зафиксированная версия. Эта сборка не меняется при дальнейшей доработке."
          fi
