name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle --no-daemon assembleDebug

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk chunks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chunks-apk
          path: chunks.apk

      # Свежий APK всегда лежит в релизе «latest»: его удобно скачать прямо с телефона.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest chunks.apk --title "Чанки, сборка ${{ github.run_number }}" --notes "Автоматическая сборка из коммита ${{ github.sha }}."
