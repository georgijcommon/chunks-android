<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Чанки</title>
<style>
/*__FONTS__*/
:root{
  --bg:#F6F3EC; --panel:#FBF9F4; --card:#FFFFFF; --line:#E3DCCD; --btn-line:#CFC5B0;
  --ink:#14171C; --ink2:#5E6470; --navy:#0E1A2B; --on-navy:#F6F3EC; --on-navy2:#B8C0CF;
  --gold:#C9A464; --gold-navy-text:#D9BC84; --gold-line:#B88E4A; --gold-text:#85642F;
  --sel:#FBF3E3; --err:#9A3B3B; --err-bg:#FBEDEA;
  --serif:"Cormorant Garamond Variable","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Manrope Variable",Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;font-weight:500;line-height:1.5;
  -webkit-text-size-adjust:100%;min-height:100vh;font-variant-numeric:lining-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--gold-text)}
:focus-visible{outline:2px solid var(--gold-line);outline-offset:2px}
.app{max-width:430px;margin:0 auto;padding:0 0 108px}

/* каркас */
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:10px 14px 8px;min-height:64px}
.icon{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink);padding:0}
.icon svg,.tabs svg,.badge svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.over{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--gold-text);text-align:center}
.bar{height:3px;background:var(--line);margin:0 28px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-line);transition:width .3s}
h1{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.05;margin:22px 28px 10px;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.1;margin:30px 28px 12px}
.t{margin:0 28px 14px;color:var(--ink2);font-size:14px}
.small{font-size:13px}
.center{text-align:center}

/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;padding:0 20px;border-radius:28px;
  border:1px solid var(--btn-line);background:none;color:var(--ink);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;text-align:center;line-height:1.15}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--ink2);cursor:default}
.btn.gold{height:46px;border:0;background:linear-gradient(180deg,#E3C990,#B88E4A);color:var(--navy)}
.link{border:0;background:none;padding:6px 0;color:var(--gold-text);font-size:13px;font-weight:700;text-decoration:underline;text-decoration-color:var(--gold-line);text-underline-offset:4px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line)}
.foot .inner{max-width:430px;margin:0 auto;padding:16px 28px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.verdict{font-size:14px;font-weight:700;text-align:center}
.verdict.ok{color:var(--gold-text)} .verdict.no{color:var(--err)}
.legend{font-size:12px;color:var(--ink2);text-align:center}

/* нижняя панель */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line)}
.tabs .inner{max-width:430px;margin:0 auto;height:calc(84px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{position:relative;border:0;background:none;display:grid;align-content:center;justify-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink2);padding:0}
.tabs button[aria-current=page]{color:var(--ink)}
.tabs button[aria-current=page]::before{content:"";position:absolute;top:10px;left:50%;width:28px;height:2px;margin-left:-14px;background:var(--gold-line)}

/* кольца */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring>svg{display:block;transform:rotate(-90deg)}
.ring>svg circle{fill:none}
.ring .arc{stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center}

/* тёмная область */
.hero{position:relative;margin:14px 20px 20px;background:var(--navy);color:var(--on-navy);border-radius:30px;padding:34px 24px 30px;
  display:grid;justify-items:center;gap:14px;text-align:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,164,100,.45);border-radius:22px;pointer-events:none}
.hero .deco{position:absolute;left:50%;top:0;width:520px;height:520px;margin-left:-260px;margin-top:-140px;pointer-events:none}
.hero>*{position:relative}
.hero .num{font-family:var(--serif);font-weight:500;font-size:66px;line-height:1}
.hero .cap{font-size:12px;color:var(--on-navy2)}
.hero .line{font-size:13px;color:var(--on-navy2);max-width:250px}
.hero .btn.gold{width:auto;min-width:210px;padding:0 26px;margin-top:4px}

/* строки и плитки */
.rowc{display:flex;align-items:center;gap:14px;margin:0 20px 12px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:22px;text-align:left}
button.rowc{width:calc(100% - 40px)}
.rowc .tx{flex:1;min-width:0}
.rowc .ti{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.rowc .ti.en{font-style:italic}
.rowc .su{font-size:13px;color:var(--ink2);margin-top:2px}
.rowc .side{flex:none;font-size:12px;color:var(--ink2);white-space:nowrap}
.rowc .side.due{color:var(--gold-text);font-weight:700}
.rowc .side.hard{color:var(--err)}
details.rowc{display:block;padding:0}
details.rowc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 18px 14px 14px}
details.rowc summary::-webkit-details-marker{display:none}
details.rowc .more{padding:0 18px 16px}
.medal{width:64px;height:64px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
.medal .val{font-family:var(--serif);font-weight:500;font-size:19px;color:var(--gold-navy-text);line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 20px 18px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink2)}
.chips button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 20px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px 14px;display:grid;justify-items:center;gap:8px;text-align:center}
.tile .val{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1}
.tile .lbl{font-size:12px;color:var(--ink2);line-height:1.3}
.opt{position:relative;min-height:168px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 16px;
  display:grid;place-items:center;text-align:center;font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.15;overflow-wrap:anywhere}
.opt.en{font-style:italic;font-size:32px}
.opt.long{font-size:18px}
.opt.right{border:2px solid var(--gold);background:var(--sel);padding:21px 15px}
.opt.wrong{border:2px solid var(--err);background:var(--err-bg);padding:21px 15px}
.opt.dim{opacity:.7}
.opt.pic{aspect-ratio:1;min-height:0;padding:0}
.opt.pic.right,.opt.pic.wrong{padding:0}
.opt.pic>svg{width:118px;height:118px}
.badge{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--gold)}
.badge.bad{background:var(--err);color:#fff}
.badge svg{width:18px;height:18px;stroke-width:2}

/* занятие */
.task{margin:18px 28px 16px;font-size:14px;color:var(--ink2)}
.arch{position:relative;width:260px;height:280px;margin:18px auto 22px;background:var(--navy);border-radius:130px 130px 28px 28px;
  display:grid;place-items:center;padding:44px 26px 30px;color:var(--on-navy)}
.arch::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,164,100,.45);border-radius:122px 122px 20px 20px;pointer-events:none}
.arch>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.arch.pic{padding:34px 0 0;margin-bottom:16px}
.arch.pic>svg:last-child{position:relative;inset:auto;width:168px;height:168px}
.arch .w{position:relative;font-family:var(--serif);font-style:italic;font-weight:600;line-height:1.05;text-align:center;overflow-wrap:anywhere}
.word{font-family:var(--serif);font-style:italic;font-weight:600;font-size:44px;line-height:1.05;text-align:center;margin:26px 28px 18px;overflow-wrap:anywhere}
.trans{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.1;text-align:center;margin:0 28px 18px;overflow-wrap:anywhere}
.trans.long{font-size:24px}
.prompt{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.15;margin:0 28px 18px}
.examples{margin:0 28px;padding:0;list-style:none}
.examples li{font-family:var(--serif);font-style:italic;font-weight:500;font-size:21px;line-height:1.3;padding:13px 0;border-top:1px solid var(--line)}
.sent{font-family:var(--serif);font-style:italic;font-weight:500;font-size:25px;line-height:1.3;margin:0 28px 18px}
.note{margin:14px 20px 0;padding:12px 16px;background:var(--sel);border-radius:18px;font-size:13px;color:var(--ink2)}
.note b{color:var(--ink);font-weight:700}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:0 20px 16px}
.tok{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:5px 13px 7px;font-family:var(--serif);font-style:italic;font-weight:600;font-size:23px;line-height:1.2;color:var(--ink)}
.tok.sel,.tok.right{border:2px solid var(--gold);background:var(--sel);padding:4px 12px 6px}
.tok.wrong{border:2px solid var(--err);background:var(--err-bg);padding:4px 12px 6px}
.field{margin:0 20px 14px}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:0 8px 6px}
input[type=text],textarea,input[type=number],select{width:100%;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:15px 18px;
  font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.25}
input.en,textarea.en{font-style:italic}
input.good{border:2px solid var(--gold);background:var(--sel);padding:14px 17px}
input.bad{border:2px solid var(--err);background:var(--err-bg);padding:14px 17px}
textarea{min-height:104px;resize:vertical;display:block}
input:disabled,textarea:disabled{opacity:1;color:var(--ink2)}
.hintline{margin:-4px 28px 12px;font-size:13px;color:var(--ink2);min-height:1px}
.model{margin:4px 20px 0;padding:14px 18px;background:var(--sel);border:1px solid var(--gold);border-radius:22px}
.model .v{font-family:var(--serif);font-style:italic;font-weight:600;font-size:23px;line-height:1.25}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{height:56px;border-radius:28px;border:1px solid var(--btn-line);background:none;display:grid;align-content:center;justify-items:center;padding:0 2px;line-height:1.2}
.rate button b{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rate button span{font-size:12px;color:var(--ink2)}
.rate button.suggest{border:2px solid var(--gold);background:var(--sel)}

/* чтение */
.reader{margin-top:8px}
.reader p{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.55;margin:0 28px 16px}
.reader .s{cursor:pointer;border-radius:4px}
.reader .s.on{background:var(--sel);text-decoration:underline;text-decoration-color:var(--gold-line);text-decoration-thickness:2px;text-underline-offset:5px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);border-radius:30px 30px 0 0;max-height:74vh;overflow:auto}
.sheet .inner{max-width:430px;margin:0 auto;padding:14px 0 calc(20px + env(safe-area-inset-bottom))}
.sheet .head{display:flex;justify-content:space-between;align-items:center;padding:0 14px 4px 28px}
.sheet .tokens .tok{font-size:20px}
.sheet .tr{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.2;margin:2px 28px 14px}
.sheet .tr.wait{font-family:var(--sans);font-weight:500;font-size:13px;line-height:1.5;color:var(--ink2)}
.sheet .field input{background:var(--bg)}
.sheet .btn{width:calc(100% - 56px);margin:4px 28px 0}

.banner{margin:8px 20px;padding:12px 16px;background:var(--err-bg);border-radius:18px;font-size:13px;color:var(--err)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:40;background:var(--navy);color:var(--on-navy);
  padding:11px 20px;border-radius:28px;font-size:13px;font-weight:600;max-width:calc(100% - 40px);text-align:center}
@media (max-width:360px){h1{font-size:34px}.opt{min-height:150px;font-size:20px}.opt.en{font-size:27px}}
@media (prefers-reduced-motion:reduce){.ring .arc,.bar i{transition:none}}
</style>
</head>
